      - name: Install Chrome Remote Desktop
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          echo "Checking libxtst6 version..."
          dpkg-query -W libxtst6

          cd /tmp

          curl -fL --retry 3 \
            -o chrome-remote-desktop.deb \
            https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb

          sudo apt-get install -y ./chrome-remote-desktop.deb

          rm -f chrome-remote-desktop.deb

          dpkg-query -W chrome-remote-desktop
