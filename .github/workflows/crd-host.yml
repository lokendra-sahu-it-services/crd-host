
name: CRD Host

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: "Google CRD start-host command"
        required: true
        type: string
      crd_pin:
        description: "CRD PIN"
        required: true
        default: "123456"
        type: string

permissions:
  contents: read

concurrency:
  group: crd-host-session
  cancel-in-progress: true

jobs:
  host:
    name: Deploy CRD Host
    runs-on: ubuntu-26.04
    timeout-minutes: 240

    steps:
      - name: Install Desktop and CRD
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            x11-xserver-utils \
            wget \
            curl \
            python3

          # Install Google Chrome
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

          # Install Chrome Remote Desktop
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo apt-get install -y ./chrome-remote-desktop_current_amd64.deb

          # Configure XFCE session
          echo "exec /usr/bin/xfce4-session" > "$HOME/.chrome-remote-desktop-session"

          echo "Desktop and CRD installed successfully."

      - name: Register CRD Host
        shell: bash
        env:
          CRD_COMMAND: ${{ inputs.crd_code }}
          CRD_PIN: ${{ inputs.crd_pin }}
        run: |
          set -euo pipefail

          # Validate PIN
          if [[ ! "$CRD_PIN" =~ ^[0-9]{6,12}$ ]]; then
            echo "Invalid CRD PIN."
            exit 1
          fi

          # Parse trusted Google command without eval.
          python3 - <<'PY'
          import os
          import shlex
          import subprocess
          import sys

          command = os.environ["CRD_COMMAND"]
          pin = os.environ["CRD_PIN"]

          try:
              args = shlex.split(command)
          except ValueError:
              sys.exit("Invalid command format.")

          # Google command may start with DISPLAY=
          if args and args[0].startswith("DISPLAY="):
              args.pop(0)

          expected = "/opt/google/chrome-remote-desktop/start-host"

          if not args or args[0] != expected:
              sys.exit("Invalid Google CRD start-host command.")

          # Remove any supplied name/PIN so our fixed values win.
          clean = []
          skip_next = False

          for arg in args:
              if skip_next:
                  skip_next = False
                  continue

              if arg in ("--name", "--pin"):
                  skip_next = True
                  continue

              if arg.startswith("--name=") or arg.startswith("--pin="):
                  continue

              clean.append(arg)

          clean.extend([
              "--name=Lokendra-CRD",
              f"--pin={pin}"
          ])

          env = os.environ.copy()
          env["DISPLAY"] = ""

          print("Registering CRD host: Lokendra-CRD")

          result = subprocess.run(clean, env=env)

          if result.returncode != 0:
              sys.exit("CRD host registration failed.")

          print("CRD host registration command completed.")
          PY

      - name: Keep Host Running
        shell: bash
        run: |
          set -e

          echo "CRD host is running."
          echo "Remote device name: Lokendra-CRD"

          for i in $(seq 1 225); do
            sleep 60
          done

          echo "CRD session time completed."

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "CRD diagnostics:"
          pgrep -af 'chrome-remote-desktop|xfce4-session' || true
          df -h /
