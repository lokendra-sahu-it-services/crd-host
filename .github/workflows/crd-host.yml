
name: "Quick Chrome Remote Desktop Host (3 Hours)"

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: "Google CRD Auth Command (from remotedesktop.google.com/headless)"
        required: true
        type: string
      crd_pin:
        description: "6-digit CRD Access PIN"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crd-host-session
  cancel-in-progress: true

jobs:
  launch-crd:
    name: "Start CRD Environment"
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check Runner
        shell: bash
        run: |
          set -euo pipefail
          echo "OS:"
          lsb_release -ds
          echo "CPU:"
          nproc
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h /

      - name: Install XFCE Desktop
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            xfce4 \
            xfce4-terminal \
            desktop-base \
            dbus-x11 \
            xscreensaver \
            curl \
            ca-certificates

          sudo bash -c \
            'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'

          sudo systemctl disable lightdm.service 2>/dev/null || true

      - name: Install Google Chrome
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp

          curl -fL --retry 3 \
            -o google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y --fix-broken ./google-chrome.deb

          rm -f google-chrome.deb

          google-chrome --version

      - name: Install Chrome Remote Desktop
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp

          curl -fL --retry 3 \
            -o chrome-remote-desktop.deb \
            https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb

          sudo apt-get install -y --fix-broken ./chrome-remote-desktop.deb

          rm -f chrome-remote-desktop.deb

          dpkg-query -W chrome-remote-desktop

      - name: Configure and Start CRD
        shell: bash
        env:
          CRD_COMMAND: ${{ inputs.crd_code }}
          CRD_PIN: ${{ inputs.crd_pin }}
        run: |
          set -euo pipefail

          CRD_USER="$(id -un)"

          # Validate PIN
          if [[ ! "$CRD_PIN" =~ ^[0-9]{6}$ ]]; then
            echo "::error::PIN must contain exactly 6 digits."
            exit 1
          fi

          # Validate the Google-generated command
          if [[ "$CRD_COMMAND" != *"/opt/google/chrome-remote-desktop/start-host"* ]]; then
            echo "::error::Invalid CRD command. Generate a fresh command from Google."
            exit 1
          fi

          echo "Starting Chrome Remote Desktop..."

          # Google-generated authorization command
          # Do not print this command: it contains a one-time authorization code.
          eval "$CRD_COMMAND --pin=$CRD_PIN"

          echo "Waiting for CRD service..."

          sudo systemctl restart \
            "chrome-remote-desktop@${CRD_USER}.service"

          sleep 5

          if ! sudo systemctl is-active --quiet \
            "chrome-remote-desktop@${CRD_USER}.service"; then

            echo "::error::Chrome Remote Desktop service failed."

            sudo systemctl status \
              "chrome-remote-desktop@${CRD_USER}.service" \
              --no-pager || true

            exit 1
          fi

          echo "=================================="
          echo "CRD HOST IS ONLINE"
          echo "=================================="
          echo "User: $CRD_USER"
          echo "Access: https://remotedesktop.google.com/access"
          echo "PIN is configured (not displayed)."
          echo "=================================="

      - name: Keep Alive (3 Hours)
        shell: bash
        run: |
          set -euo pipefail

          TOTAL_SECONDS=10800
          INTERVAL=60
          ELAPSED=0

          echo "CRD session started. Maximum duration: 180 minutes."

          while (( ELAPSED < TOTAL_SECONDS )); do
            REMAINING=$(( (TOTAL_SECONDS - ELAPSED) / 60 ))

            echo "CRD ONLINE | Remaining: ${REMAINING} minutes"

            sleep "$INTERVAL"
            ELAPSED=$(( ELAPSED + INTERVAL ))
          done

          echo "3-hour session completed."

      - name: Final CRD Status
        if: always()
        shell: bash
        run: |
          echo "Runner shutdown / session status:"
          sudo systemctl status \
            "chrome-remote-desktop@$(id -un).service" \
            --no-pager || true
