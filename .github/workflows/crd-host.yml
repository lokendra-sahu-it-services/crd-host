
name: CRD Host

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: "Google CRD start-host command"
        required: true
        type: string
      crd_pin:
        description: "CRD PIN"
        required: true
        default: "123456"
        type: string

permissions:
  contents: read

concurrency:
  group: crd-host-session
  cancel-in-progress: true

jobs:
  host:
    name: Deploy CRD Host
    runs-on: ubuntu-26.04
    timeout-minutes: 240

    steps:
      - name: Audit Packages Before Installation
        shell: bash
        run: |
          set -euo pipefail

          dpkg-query -W -f='${db:Status-Abbrev}\t${binary:Package}\t${Version}\n' \
            | awk '$1=="ii"' | sort > /tmp/packages-before.txt

          echo "Packages before: $(wc -l < /tmp/packages-before.txt)"

      - name: Install Minimal CRD Desktop
        shell: bash
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update -qq

          # Basic XFCE desktop + File Manager + Terminal
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 \
            xfce4-session \
            xfce4-panel \
            xfdesktop4 \
            xfwm4 \
            xfce4-settings \
            thunar \
            xfce4-terminal \
            x11-xserver-utils

          # Download Google Chrome
          curl -fsSL --retry 3 \
            -o google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          # Download Chrome Remote Desktop
          curl -fsSL --retry 3 \
            -o chrome-remote-desktop.deb \
            https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb

          # Install Chrome + CRD with required dependencies only
          sudo apt-get install -y --no-install-recommends \
            ./google-chrome.deb \
            ./chrome-remote-desktop.deb

          rm -f google-chrome.deb chrome-remote-desktop.deb

          # Configure XFCE session
          echo "exec /usr/bin/xfce4-session" \
            > "$HOME/.chrome-remote-desktop-session"

          # Clean package cache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "Minimal CRD desktop installation completed."

      - name: Audit Newly Installed Packages
        shell: bash
        run: |
          set -euo pipefail

          dpkg-query -W -f='${db:Status-Abbrev}\t${binary:Package}\t${Version}\n' \
            | awk '$1=="ii"' | sort > /tmp/packages-after.txt

          echo "===== NEWLY INSTALLED PACKAGES ====="
          comm -13 \
            <(cut -f2 /tmp/packages-before.txt | sort) \
            <(cut -f2 /tmp/packages-after.txt | sort)

          echo "===== PACKAGE COUNTS ====="
          echo "Before: $(wc -l < /tmp/packages-before.txt)"
          echo "After:  $(wc -l < /tmp/packages-after.txt)"

      - name: Register CRD Host
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import shlex
          import subprocess
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              inputs = json.load(f).get("inputs", {})

          command = str(inputs.get("crd_code", ""))
          pin = str(inputs.get("crd_pin", ""))

          if not command or "\n" in command or "\r" in command:
              sys.exit("Invalid CRD command.")

          if not pin.isdigit() or not 6 <= len(pin) <= 12:
              sys.exit("Invalid CRD PIN.")

          try:
              args = shlex.split(command)
          except ValueError:
              sys.exit("Invalid command format.")

          if args and args[0].startswith("DISPLAY="):
              args.pop(0)

          expected = "/opt/google/chrome-remote-desktop/start-host"

          if not args or args[0] != expected:
              sys.exit("Invalid Google CRD start-host command.")

          if not any(a.startswith("--code=") for a in args):
              sys.exit("Missing Google authorization code.")

          if not any(a.startswith("--redirect-url=") for a in args):
              sys.exit("Missing Google redirect URL.")

          print(f"::add-mask::{command}")
          print(f"::add-mask::{pin}")

          for arg in args:
              if arg.startswith("--code="):
                  print(f"::add-mask::{arg.split('=', 1)[1]}")

          clean = [args[0]]
          i = 1

          while i < len(args):
              arg = args[i]

              if arg in ("--name", "--pin"):
                  i += 2
                  continue

              if arg.startswith("--name=") or arg.startswith("--pin="):
                  i += 1
                  continue

              clean.append(arg)
              i += 1

          clean.extend([
              "--name=Lokendra-CRD",
              f"--pin={pin}"
          ])

          env = os.environ.copy()
          env["DISPLAY"] = ""

          print("Registering device: Lokendra-CRD")

          result = subprocess.run(clean, env=env)

          if result.returncode != 0:
              sys.exit("CRD registration failed.")

          print("CRD host registered successfully.")
          PY

      - name: Keep Host Running
        shell: bash
        run: |
          set -e

          echo "CRD host running: Lokendra-CRD"

          for ((i=0; i<225; i++)); do
            sleep 60
          done

          echo "CRD session completed."

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "===== CRD PROCESSES ====="
          pgrep -af 'chrome-remote-desktop|xfce4-session|xfwm4' || true

          echo "===== DESKTOP PROCESSES ====="
          pgrep -af 'thunar|xfce4-panel|xfdesktop' || true

          echo "===== DISK USAGE ====="
          df -h
