
name: CRD Host

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: "Google CRD start-host command"
        required: true
        type: string
      crd_pin:
        description: "CRD PIN"
        required: true
        default: "123456"
        type: string

permissions:
  contents: read

concurrency:
  group: crd-host-session
  cancel-in-progress: true

jobs:
  host:
    name: Deploy CRD Host
    runs-on: ubuntu-26.04
    timeout-minutes: 240

    steps:
      - name: Audit Packages Before Installation
        shell: bash
        run: |
          set -euo pipefail

          dpkg-query -W -f='${db:Status-Abbrev}\t${binary:Package}\t${Version}\n' \
            | awk '$1=="ii"' | sort > /tmp/packages-before.txt

          echo "Packages before: $(wc -l < /tmp/packages-before.txt)"

      - name: Install Minimal CRD Desktop
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update -qq

          # Minimal XFCE + File Manager + Terminal
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 \
            xfce4-session \
            xfce4-panel \
            xfdesktop4 \
            xfwm4 \
            xfce4-settings \
            thunar \
            xfce4-terminal \
            x11-xserver-utils

          # Download Chrome
          curl -fsSL --retry 3 \
            -o google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          # Download CRD
          curl -fsSL --retry 3 \
            -o chrome-remote-desktop.deb \
            https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb

          # Install Chrome + CRD
          sudo apt-get install -y --no-install-recommends \
            ./google-chrome.deb \
            ./chrome-remote-desktop.deb

          rm -f google-chrome.deb chrome-remote-desktop.deb

          # Configure desktop
          echo "exec /usr/bin/xfce4-session" \
            > "$HOME/.chrome-remote-desktop-session"

          echo "CRD desktop installed."

      - name: Remove Unwanted Runner Tools
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # Remove standalone CMake binary
          if [[ -f /usr/local/bin/cmake ]]; then
            sudo rm -f /usr/local/bin/cmake
          fi

          # Remove unwanted APT applications if installed
          packages=(
            firefox
            firefox-esr
            microsoft-edge-stable
            cmake
            vim
            vim-tiny
            vim-runtime
            texinfo
            info
          )

          remove=()

          for pkg in "${packages[@]}"; do
            status="$(dpkg-query -W -f='${db:Status-Abbrev}' "$pkg" 2>/dev/null || true)"

            if [[ "$status" == ii* ]]; then
              remove+=("$pkg")
            fi
          done

          if ((${#remove[@]})); then
            sudo apt-get purge -y "${remove[@]}"
          fi

          # Remove Firefox snap if present
          if command -v snap >/dev/null 2>&1 && snap list firefox >/dev/null 2>&1; then
            sudo snap remove firefox
          fi

          # Verify CMake
          if command -v cmake >/dev/null 2>&1; then
            echo "CMake still exists at: $(command -v cmake)"
          else
            echo "CMake successfully removed."
          fi

          sudo apt-get clean

      - name: Audit Newly Installed Packages
        shell: bash
        run: |
          set -euo pipefail

          dpkg-query -W -f='${db:Status-Abbrev}\t${binary:Package}\t${Version}\n' \
            | awk '$1=="ii"' | sort > /tmp/packages-after.txt

          echo "===== NEWLY INSTALLED PACKAGES ====="
          comm -13 \
            <(cut -f2 /tmp/packages-before.txt | sort) \
            <(cut -f2 /tmp/packages-after.txt | sort)

          echo "===== UNWANTED APPLICATION CHECK ====="
          for app in firefox firefox-esr microsoft-edge-stable cmake; do
            dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\n' \
              "$app" 2>/dev/null || true
          done

          echo "===== PACKAGE COUNTS ====="
          echo "Before: $(wc -l < /tmp/packages-before.txt)"
          echo "After: $(wc -l < /tmp/packages-after.txt)"

      - name: Register CRD Host
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import shlex
          import subprocess
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              inputs = json.load(f).get("inputs", {})

          command = str(inputs.get("crd_code", ""))
          pin = str(inputs.get("crd_pin", ""))

          if not command or "\n" in command or "\r" in command:
              sys.exit("Invalid CRD command.")

          if not pin.isdigit() or not 6 <= len(pin) <= 12:
              sys.exit("Invalid CRD PIN.")

          try:
              args = shlex.split(command)
          except ValueError:
              sys.exit("Invalid command format.")

          if args and args[0].startswith("DISPLAY="):
              args.pop(0)

          expected = "/opt/google/chrome-remote-desktop/start-host"

          if not args or args[0] != expected:
              sys.exit("Invalid Google CRD start-host command.")

          if not any(a.startswith("--code=") for a in args):
              sys.exit("Missing Google authorization code.")

          if not any(a.startswith("--redirect-url=") for a in args):
              sys.exit("Missing Google redirect URL.")

          print(f"::add-mask::{command}")
          print(f"::add-mask::{pin}")

          for arg in args:
              if arg.startswith("--code="):
                  print(f"::add-mask::{arg.split('=', 1)[1]}")

          clean = [args[0]]
          i = 1

          while i < len(args):
              arg = args[i]

              if arg in ("--name", "--pin"):
                  i += 2
                  continue

              if arg.startswith("--name=") or arg.startswith("--pin="):
                  i += 1
                  continue

              clean.append(arg)
              i += 1

          clean.extend([
              "--name=Lokendra-CRD",
              f"--pin={pin}"
          ])

          env = os.environ.copy()
          env["DISPLAY"] = ""

          print("Registering device: Lokendra-CRD")

          result = subprocess.run(clean, env=env)

          if result.returncode != 0:
              sys.exit("CRD registration failed.")

          print("CRD host registered successfully.")
          PY

      - name: Keep Host Running
        shell: bash
        run: |
          set -e

          echo "CRD host running: Lokendra-CRD"

          for ((i=0; i<225; i++)); do
            sleep 60
          done

          echo "CRD session completed."

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "===== CRD PROCESSES ====="
          pgrep -af 'chrome-remote-desktop|xfce4-session|xfwm4' || true

          echo "===== DESKTOP PROCESSES ====="
          pgrep -af 'thunar|xfce4-panel|xfdesktop' || true

          echo "===== CMAKE CHECK ====="
          command -v cmake || echo "CMake not found"

          echo "===== DISK USAGE ====="
          df -h
