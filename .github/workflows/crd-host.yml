
name: CRD Host

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: "Google CRD start-host command"
        required: true
        type: string
      crd_pin:
        description: "CRD PIN"
        required: true
        default: "123456"
        type: string

permissions:
  contents: read

concurrency:
  group: crd-host-session
  cancel-in-progress: true

jobs:
  host:
    name: Deploy CRD Host
    runs-on: ubuntu-26.04
    timeout-minutes: 240

    steps:
      # -----------------------------------------------
      # 1. AUDIT BASE RUNNER
      # -----------------------------------------------
      - name: Audit Packages Before Installation
        shell: bash
        run: |
          set -euo pipefail

          echo "===== OS VERSION ====="
          cat /etc/os-release

          dpkg-query -W -f='${db:Status-Abbrev}\t${binary:Package}\t${Version}\n' \
            | awk '$1=="ii"' | sort > /tmp/packages-before.txt

          echo "Packages before: $(wc -l < /tmp/packages-before.txt)"

      # -----------------------------------------------
      # 2. INSTALL MINIMAL DESKTOP
      # -----------------------------------------------
      - name: Install Minimal CRD Desktop
        shell: bash
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update -qq

          # Basic XFCE + File Manager + Terminal
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 \
            xfce4-session \
            xfce4-panel \
            xfdesktop4 \
            xfwm4 \
            xfce4-settings \
            thunar \
            xfce4-terminal \
            x11-xserver-utils

          # Download Google Chrome
          curl -fsSL --retry 3 \
            -o google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          # Download Chrome Remote Desktop
          curl -fsSL --retry 3 \
            -o chrome-remote-desktop.deb \
            https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb

          # Install Chrome + CRD and required dependencies
          sudo apt-get install -y --no-install-recommends \
            ./google-chrome.deb \
            ./chrome-remote-desktop.deb

          rm -f google-chrome.deb chrome-remote-desktop.deb

          # Configure XFCE session
          echo "exec /usr/bin/xfce4-session" \
            > "$HOME/.chrome-remote-desktop-session"

          echo "Minimal CRD desktop installed."

      # -----------------------------------------------
      # 3. REMOVE UNWANTED APPLICATIONS
      # -----------------------------------------------
      - name: Remove Unwanted Runner Applications
        shell: bash
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          # Remove unwanted APT packages if installed
          packages=(
            firefox
            firefox-esr
            firefox-locale-en
            microsoft-edge-stable
            cmake
            cmake-data
            cmake-curses-gui
            cmake-qt-gui
            cmake-doc
            vim
            vim-tiny
            vim-runtime
            texinfo
            info
          )

          remove=()

          for pkg in "${packages[@]}"; do
            status="$(dpkg-query -W -f='${db:Status-Abbrev}' \
              "$pkg" 2>/dev/null || true)"

            if [[ "$status" == ii* ]]; then
              remove+=("$pkg")
            fi
          done

          if ((${#remove[@]})); then
            echo "Purging packages: ${remove[*]}"
            sudo apt-get purge -y "${remove[@]}"
          fi

          # Remove Firefox Snap if present
          if command -v snap >/dev/null 2>&1; then
            if snap list firefox >/dev/null 2>&1; then
              sudo snap remove firefox
            fi
          fi

          # Remove standalone CMake binaries
          for dir in /usr/local/bin /usr/bin; do
            if [[ -d "$dir" ]]; then
              sudo find "$dir" -maxdepth 1 \
                \( -type f -o -type l \) \
                \( -name cmake -o -name cmake-gui -o -name ccmake \) \
                -print -delete
            fi
          done

          # Remove GitHub hosted-toolcache CMake
          sudo rm -rf \
            /opt/hostedtoolcache/CMake \
            /opt/hostedtoolcache/cmake

          # Remove standalone CMake support directories
          sudo rm -rf \
            /usr/local/share/cmake \
            /usr/local/share/cmake-* \
            /usr/local/lib/cmake \
            /usr/local/lib/cmake-* \
            /usr/share/cmake \
            /usr/share/cmake-* \
            /usr/lib/cmake \
            /usr/lib/cmake-*

          # Remove CMake and Bulk Rename menu shortcuts
          for dir in \
            /usr/share/applications \
            /usr/local/share/applications
          do
            if [[ -d "$dir" ]]; then
              while IFS= read -r -d '' file; do
                echo "Removing launcher: $file"
                sudo rm -f "$file"
              done < <(
                sudo find "$dir" -maxdepth 1 -type f \
                  \( -iname '*cmake*.desktop' \
                     -o -iname '*bulk-rename*.desktop' \
                     -o -iname '*bulkrename*.desktop' \) \
                  -print0
              )
            fi
          done

          # Refresh desktop application menu cache if available
          if command -v update-desktop-database >/dev/null 2>&1; then
            sudo update-desktop-database /usr/share/applications || true
          fi

          # Clean downloaded package cache
          sudo apt-get clean

          echo "Unwanted application cleanup completed."

      # -----------------------------------------------
      # 4. VERIFY INSTALLATION
      # -----------------------------------------------
      - name: Verify Desktop and Cleanup
        shell: bash
        run: |
          set -euo pipefail

          echo "===== REQUIRED APPLICATIONS ====="

          for app in \
            google-chrome \
            chrome-remote-desktop \
            xfce4-session \
            xfce4-panel \
            xfwm4 \
            xfdesktop \
            xfce4-settings \
            thunar \
            xfce4-terminal
          do
            if command -v "$app" >/dev/null 2>&1; then
              echo "OK: $app"
            elif dpkg-query -W -f='${db:Status-Abbrev}' \
              "$app" 2>/dev/null | grep -q '^ii'; then
              echo "OK: $app (installed package)"
            else
              echo "CHECK: $app"
            fi
          done

          echo "===== CMAKE EXECUTABLE CHECK ====="

          for dir in /usr/local/bin /usr/bin /opt/hostedtoolcache; do
            if [[ -d "$dir" ]]; then
              sudo find "$dir" \
                \( -name cmake -o -name cmake-gui -o -name ccmake \) \
                -print 2>/dev/null || true
            fi
          done

          echo "===== UNWANTED APT PACKAGE CHECK ====="

          for app in firefox firefox-esr microsoft-edge-stable cmake; do
            dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\n' \
              "$app" 2>/dev/null || true
          done

          echo "===== PACKAGE COUNT ====="
          dpkg-query -W -f='${db:Status-Abbrev}\n' \
            | grep -c '^ii' || true

      # -----------------------------------------------
      # 5. REGISTER CRD HOST
      # -----------------------------------------------
      - name: Register CRD Host
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import shlex
          import subprocess
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              inputs = json.load(f).get("inputs", {})

          command = str(inputs.get("crd_code", ""))
          pin = str(inputs.get("crd_pin", ""))

          if not command or "\n" in command or "\r" in command:
              sys.exit("Invalid CRD command.")

          if not pin.isdigit() or not 6 <= len(pin) <= 12:
              sys.exit("Invalid CRD PIN.")

          try:
              args = shlex.split(command)
          except ValueError:
              sys.exit("Invalid command format.")

          if args and args[0].startswith("DISPLAY="):
              args.pop(0)

          expected = "/opt/google/chrome-remote-desktop/start-host"

          if not args or args[0] != expected:
              sys.exit("Invalid Google CRD start-host command.")

          if not any(a.startswith("--code=") for a in args):
              sys.exit("Missing Google authorization code.")

          if not any(a.startswith("--redirect-url=") for a in args):
              sys.exit("Missing Google redirect URL.")

          print(f"::add-mask::{command}")
          print(f"::add-mask::{pin}")

          for arg in args:
              if arg.startswith("--code="):
                  print(f"::add-mask::{arg.split('=', 1)[1]}")

          clean = [args[0]]
          i = 1

          while i < len(args):
              arg = args[i]

              if arg in ("--name", "--pin"):
                  i += 2
                  continue

              if arg.startswith("--name=") or arg.startswith("--pin="):
                  i += 1
                  continue

              clean.append(arg)
              i += 1

          clean.extend([
              "--name=Lokendra-CRD",
              f"--pin={pin}"
          ])

          env = os.environ.copy()
          env["DISPLAY"] = ""

          print("Registering device: Lokendra-CRD")

          result = subprocess.run(clean, env=env)

          if result.returncode != 0:
              sys.exit("CRD registration failed.")

          print("CRD host registered successfully.")
          PY

      # -----------------------------------------------
      # 6. KEEP HOST RUNNING
      # -----------------------------------------------
      - name: Keep Host Running
        shell: bash
        run: |
          set -e

          echo "CRD host running: Lokendra-CRD"

          for ((i=0; i<225; i++)); do
            sleep 60
          done

          echo "CRD session completed."

      # -----------------------------------------------
      # 7. FINAL DIAGNOSTICS
      # -----------------------------------------------
      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "===== CRD PROCESSES ====="
          pgrep -af 'chrome-remote-desktop|xfce4-session|xfwm4' || true

          echo "===== DESKTOP PROCESSES ====="
          pgrep -af 'thunar|xfce4-panel|xfdesktop' || true

          echo "===== CMAKE CHECK ====="
          command -v cmake || echo "CMake command not found"

          echo "===== DISK USAGE ====="
          df -h
